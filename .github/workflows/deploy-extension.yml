name: Deploy Extension

# A published release builds the packages and submits them to every store.
# Run by hand, it builds them and checks the store credentials: it only submits with "publish" ticked.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: Submit to the stores (off = only build, and check the credentials)
        type: boolean
        default: false
      store:
        description: Which store
        type: choice
        options:
          - all
          - chrome
          - firefox
          - edge
        default: all
      library-ref:
        description: Branch or tag of wanikani-api-manager to build with
        type: string
        default: main
      highlighter-ref:
        description: Branch or tag of cjk-highlighter to build with
        type: string
        default: main

permissions:
  contents: read

env:
  # read by publish-extension: anything but a release or a ticked "publish" stops before uploading
  DRY_RUN: ${{ (github.event_name == 'release' || inputs.publish) && 'false' || 'true' }}
  # not WXT's own copy: only recent versions use the Chrome Web Store's API v2 (v1.1 is shut down)
  PUBLISH_EXTENSION: publish-browser-extension@6.2.0
  WEB_EXT: web-ext@10.8.0

jobs:
  package:
    name: Build the packages
    runs-on: ubuntu-latest
    steps:
      # the folders as on a developer's machine: the extension installs its libraries from
      # ../wanikani-api-manager and ../../cjk-highlighter (they aren't on npm)
      - name: Check out the extension
        uses: actions/checkout@v7
        with:
          path: wanikani/wanikani-kanji-highlighter

      - name: Check out the library
        uses: actions/checkout@v7
        with:
          repository: digas99/wanikani-api-manager
          ref: ${{ inputs.library-ref || 'main' }}
          path: wanikani/wanikani-api-manager

      # the page highlighting, shared with the HanziHero Companion
      - name: Check out the highlighter
        uses: actions/checkout@v7
        with:
          repository: digas99/cjk-highlighter
          ref: ${{ inputs.highlighter-ref || 'main' }}
          path: cjk-highlighter

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the release tag matches the version
        if: github.event_name == 'release'
        working-directory: wanikani/wanikani-kanji-highlighter
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG doesn't match version $version in package.json"
            exit 1
          fi

      - name: Build the library
        working-directory: wanikani/wanikani-api-manager
        run: |
          npm ci
          npm run build:lib

      # TypeScript source, compiled with the extension: nothing to build
      - name: Test the highlighter
        working-directory: cjk-highlighter
        run: |
          npm ci
          npm test

      - name: Build and zip the extension
        working-directory: wanikani/wanikani-kanji-highlighter
        run: |
          npm ci
          npm run zip
          npm run zip:firefox

      - name: Lint the Firefox build
        working-directory: wanikani/wanikani-kanji-highlighter
        run: npx --yes "$WEB_EXT" lint --source-dir .output/firefox-mv2

      # Firefox's reviewers rebuild the extension from source, which takes the libraries too (same folders)
      - name: Collect the packages and the source package
        run: |
          mkdir packages sources
          cp wanikani/wanikani-kanji-highlighter/.output/*.zip packages/
          git -C wanikani/wanikani-kanji-highlighter archive --prefix=wanikani/wanikani-kanji-highlighter/ HEAD | tar -x -C sources
          git -C wanikani/wanikani-api-manager archive --prefix=wanikani/wanikani-api-manager/ HEAD -- . ':!docs' ':!demo' | tar -x -C sources
          git -C cjk-highlighter archive --prefix=cjk-highlighter/ HEAD | tar -x -C sources
          cp wanikani/wanikani-kanji-highlighter/.github/SOURCE_PACKAGE.md sources/README.md
          version=$(node -p "require('./wanikani/wanikani-kanji-highlighter/package.json').version")
          (cd sources && zip -qr "../packages/wanikani-kanji-highlighter-$version-sources.zip" .)

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/*.zip
          if-no-files-found: error
          retention-days: 30

  chrome:
    name: Chrome Web Store
    needs: package
    if: github.event_name == 'release' || inputs.store == 'all' || inputs.store == 'chrome'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: packages

      - name: Submit to the Chrome Web Store
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: pdbjikelneighjgjojikkmhiehpcokjm
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          # the key works pasted from the service account's JSON file, with its line breaks as \n
          export CHROME_SERVICE_ACCOUNT_PRIVATE_KEY="$(printf '%b' "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY")"
          npx --yes "$PUBLISH_EXTENSION" --chrome-zip *-chrome.zip

  firefox:
    name: Firefox Add-ons
    needs: package
    if: github.event_name == 'release' || inputs.store == 'all' || inputs.store == 'firefox'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: packages

      - name: Submit to Firefox Add-ons
        env:
          FIREFOX_EXTENSION_ID: wanikani-kanji-highlighter@wkhighlighter.com
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: npx --yes "$PUBLISH_EXTENSION" --firefox-zip *-firefox.zip --firefox-sources-zip *-sources.zip

  edge:
    name: Edge Add-ons
    needs: package
    if: github.event_name == 'release' || inputs.store == 'all' || inputs.store == 'edge'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          name: packages

      # Edge takes the same package as Chrome
      - name: Submit to Edge Add-ons
        env:
          EDGE_PRODUCT_ID: fc9fbef4-2a2a-41e4-8b2e-5dc5986cad74
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: npx --yes "$PUBLISH_EXTENSION" --edge-zip *-chrome.zip
